name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  docker:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TokenSip
            org.opencontainers.image.description=Self-hosted AI gateway that cuts LLM costs with cache-aware context optimization
          annotations: |
            org.opencontainers.image.title=TokenSip
            org.opencontainers.image.description=Self-hosted AI gateway that cuts LLM costs with cache-aware context optimization
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: Publish to npm
    uses: ./.github/workflows/npm-publish.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [docker, npm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1        { found = 1; next }
            found && /^## \[/                     { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found                                 { started = 1; print }
          ' CHANGELOG.md \
            | sed -E "s#\]\((docs/[^)]+)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" \
            > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          name: TokenSip ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
