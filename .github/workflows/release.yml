name: Release

# Two ways to release:
#   - push a tag:  git tag -a v2.1.0 -m "..." && git push origin v2.1.0
#   - or Actions → Release → Run workflow with version 2.1.0, which tags the
#     selected commit when it creates the GitHub release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 2.1.0 (must match package.json and have a CHANGELOG section)
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v${INPUT_VERSION#v}"; fi
          VERSION="${TAG#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          for pkg in packages/core packages/server packages/web; do
            actual=$(node -p "require('./$pkg/package.json').version")
            [ "$actual" = "$VERSION" ] || { echo "::error::$pkg/package.json is $actual, not $VERSION"; exit 1; }
          done
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != "push" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "sha=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"

  docker:
    name: Publish image to GHCR
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TokenSip
            org.opencontainers.image.description=Self-hosted AI gateway that cuts LLM costs with cache-aware context optimization
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          annotations: |
            org.opencontainers.image.title=TokenSip
            org.opencontainers.image.description=Self-hosted AI gateway that cuts LLM costs with cache-aware context optimization
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: Publish to npm
    needs: prepare
    uses: ./.github/workflows/npm-publish.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  github-release:
    name: GitHub release
    needs: [prepare, docker, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1        { found = 1; next }
            found && /^## \[/                     { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found                                 { started = 1; print }
          ' CHANGELOG.md \
            | sed -E "s#\]\((docs/[^)]+)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" \
            > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: TokenSip ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
